<!DOCTYPE html>
<html lang="en" class="page">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!--{{head}}-->
<meta name="theme-color" content="#161616">
<link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32">
<link rel="icon" href="/favicon-16.png" type="image/png" sizes="16x16">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="stylesheet" href="/styles/site.css">
<style>
/* Vector Cam. A tool room: no mesh behind it (the camera and the tracer want
   the whole budget), same paper, ink and mono as every other room. Layout: the
   viewfinder left (top on phones), the dials in a glass card on the right. */
html.page, html.page body { background: var(--paper-room); }
.vc [hidden] { display: none !important; }
.vc {
  --line: rgba(255, 255, 255, 0.1);
  --glass: rgba(255, 255, 255, 0.045);
  --bright: #e8e8e8;
  max-width: 1080px; margin: 0 auto;
  padding: 108px 26px 120px;
  display: grid; gap: 20px;
}
.vc .title { margin-bottom: 0; }
.vc-main { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 20px; align-items: start; }
@media (max-width: 860px) { .vc-main { grid-template-columns: minmax(0, 1fr); } }
@media (max-width: 560px) { .vc { padding: 164px 18px 110px; } }
/* phones: the viewfinder and shutter stay pinned while the dials scroll under
   them, so every adjustment is visible as it happens */
@media (max-width: 860px) {
  .vc-col { position: sticky; top: 0; z-index: 4; background: var(--paper-room);
    padding-top: calc(10px + env(safe-area-inset-top, 0px)); padding-bottom: 10px;
    margin-top: calc(-10px - env(safe-area-inset-top, 0px)); }
  .stage { width: min(100%, calc(36vh * var(--ar))); }
  .vc-col .hint { display: none; }
  .shutter { width: 60px; height: 60px; } .shutter::after { width: 46px; height: 46px; }
  .actions .btn { padding: 12px; }
}

.vc-col { display: grid; gap: 12px; min-width: 0; }

/* the viewfinder: a faint drafting grid with ruler marks, nothing louder */
.mat {
  position: relative; border-radius: 14px; border: 1px solid var(--line);
  padding: 26px 14px 14px 26px; background-color: #101010;
  background-image:
    linear-gradient(rgba(255,255,255,.07) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.07) 1px, transparent 1px),
    linear-gradient(rgba(255,255,255,.028) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.028) 1px, transparent 1px);
  background-size: 100px 100px, 100px 100px, 20px 20px, 20px 20px; background-position: -1px -1px;
}
.ruler { position: absolute; font-size: 10px; letter-spacing: .12em; color: var(--faint); }
.ruler.top { top: 8px; left: 26px; right: 14px; display: flex; justify-content: space-between; }
.ruler.side { left: 7px; top: 26px; bottom: 14px; writing-mode: vertical-rl; transform: rotate(180deg); display: flex; justify-content: space-between; }
.stage { --ar: 1.5; width: min(100%, calc(62vh * var(--ar))); position: relative; margin: 0 auto; max-width: 100%; outline: 1px dashed rgba(255,255,255,.14); outline-offset: 3px; }
.stage canvas, .stage svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.stage svg { pointer-events: none; }
.stage.drop { outline: 1px solid var(--bright); }
.chip { position: absolute; top: 8px; left: 8px; font-size: 10px; letter-spacing: .2em; background: rgba(0,0,0,.6); color: var(--ink); padding: 4px 8px; border-radius: 4px; display: flex; align-items: center; gap: 6px; text-transform: lowercase; }
.chip .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--warn); animation: blink 1.2s infinite; }
@keyframes blink { 50% { opacity: .25; } }
.flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; }
.flash.go { animation: flash .35s ease-out; }
@keyframes flash { from { opacity: .7; } to { opacity: 0; } }
.readout { font-size: 11px; color: var(--dim); display: flex; flex-wrap: wrap; gap: 4px 16px; font-variant-numeric: tabular-nums; }
.readout b { color: var(--ink); font-weight: 400; }

.actions { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.actions .btn { flex: 1 1 140px; }
.btn {
  appearance: none; border: 1px solid var(--line); background: var(--glass); color: var(--ink);
  font: 12px/1 var(--mono); letter-spacing: .12em; text-transform: lowercase;
  padding: 14px; border-radius: 10px; cursor: pointer;
  display: flex; align-items: center; justify-content: center; gap: 8px; text-align: center;
  transition: border-color 160ms ease, background 160ms ease;
}
.btn:hover { border-color: rgba(255,255,255,.22); }
.btn.primary { background: rgba(255,255,255,.12); color: var(--bright); border-color: rgba(255,255,255,.2); }
.btn.primary:hover { background: rgba(255,255,255,.16); }
.btn svg { width: 16px; height: 16px; flex: none; }
.shutter { flex: none; width: 70px; height: 70px; border-radius: 50%; border: 2px solid var(--ink); background: transparent; cursor: pointer; display: grid; place-items: center; padding: 0; }
.shutter::after { content: ""; width: 54px; height: 54px; border-radius: 50%; background: var(--bright); transition: transform .1s; }
.shutter:active::after { transform: scale(.88); }
input[type=file] { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
.hint { font-size: 11px; color: var(--dim); max-width: 62ch; }

.dials { background: var(--glass); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: grid; gap: 16px; min-width: 0; }
.group { display: grid; gap: 12px; }
.group + .group { border-top: 1px solid rgba(255,255,255,.07); padding-top: 16px; }
.label { font-size: 10px; letter-spacing: .24em; color: var(--dim); }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: rgba(0,0,0,.25); border: 1px solid var(--line); border-radius: 9px; padding: 3px; gap: 3px; }
.seg button { appearance: none; border: 0; background: transparent; color: var(--dim); font: 11px/1 var(--mono); letter-spacing: .1em; padding: 9px 4px; border-radius: 6px; cursor: pointer; text-transform: lowercase; }
.seg button[aria-pressed="true"] { background: rgba(255,255,255,.1); color: var(--bright); }
.ctl { display: grid; gap: 4px; }
.ctl-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.ctl-head label { color: var(--ink); text-transform: lowercase; }
.val { font-size: 11px; color: var(--dim); font-variant-numeric: tabular-nums; }
input[type=range] { width: 100%; accent-color: #c0c0c0; margin: 0; height: 28px; }
.row { display: flex; align-items: center; gap: 10px; }
.mini { appearance: none; border: 1px solid var(--line); background: transparent; color: var(--dim); font: 10px/1 var(--mono); letter-spacing: .14em; padding: 4px 7px; border-radius: 5px; cursor: pointer; text-transform: lowercase; }
.mini[aria-pressed="true"] { color: var(--bright); background: rgba(255,255,255,.08); }
.check { display: flex; align-items: center; gap: 9px; cursor: pointer; text-transform: lowercase; }
.check input { width: 16px; height: 16px; accent-color: #c0c0c0; margin: 0; }
.swatches { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.sw { width: 28px; height: 28px; border-radius: 50%; border: 1px solid rgba(255,255,255,.2); cursor: pointer; padding: 0; }
.sw[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--paper-room), 0 0 0 3px var(--bright); }
.sw-pick { position: relative; width: 28px; height: 28px; border-radius: 50%; overflow: hidden; border: 1px dashed rgba(255,255,255,.3); }
.sw-pick input { position: absolute; inset: -6px; width: 40px; height: 40px; border: 0; padding: 0; cursor: pointer; opacity: 0; }
.sw-pick span { position: absolute; inset: 0; display: grid; place-items: center; color: var(--dim); pointer-events: none; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
textarea { width: 100%; min-height: 140px; font: 11px/1.4 var(--mono); background: rgba(0,0,0,.3); color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 8px; resize: vertical; }
.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 5;
  background: #e8e8e8; color: #161616; font: 12px/1.3 var(--mono); letter-spacing: .04em; padding: 10px 14px; border-radius: 8px;
  opacity: 0; transition: opacity .2s; pointer-events: none; max-width: calc(100% - 36px); text-align: center; }
.toast.show { opacity: 1; }
@media (prefers-reduced-motion: reduce) { .toast, .shutter::after, .btn { transition: none; } .chip .dot, .flash.go { animation: none; } }
</style>
</head>
<body data-room="tools">

<div class="vc">
  <div class="title">tools / vector cam</div>

  <div class="vc-main">
    <section class="vc-col">
      <div class="mat" id="mat">
        <div class="ruler top" id="rulerX"><span>0</span><span></span><span></span></div>
        <div class="ruler side" id="rulerY"><span>0</span><span></span></div>
        <div class="stage" id="stage">
          <canvas id="photo"></canvas>
          <svg id="out" xmlns="http://www.w3.org/2000/svg"></svg>
          <div class="flash" id="flash"></div>
          <div class="chip" id="chip">sample photo</div>
        </div>
      </div>
      <div class="readout" id="readout"></div>

      <div class="actions" id="idleActions">
        <button type="button" class="btn primary" id="startBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>
          start camera
        </button>
        <label class="btn" for="fileIn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="m3 16 5-5 4 4 3-3 6 6"/></svg>
          choose image
        </label>
        <input type="file" id="fileIn" accept="image/*">
      </div>
      <div class="actions" id="liveActions" hidden>
        <button type="button" class="btn" id="flipBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 0 1 15-6.7L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-15 6.7L3 16"/><path d="M3 21v-5h5"/></svg>
          flip
        </button>
        <button type="button" class="shutter" id="shutter" aria-label="Capture"></button>
        <button type="button" class="btn" id="stopBtn">stop</button>
      </div>
      <div class="actions" id="capActions" hidden>
        <button type="button" class="btn" id="retakeBtn">retake</button>
        <button type="button" class="btn primary" id="dlBtn2">download svg</button>
      </div>
      <p class="hint">Point the camera and move the dials. The trace follows live. The shutter freezes the frame and traces it again at full resolution. Nothing leaves your device.</p>
    </section>

    <aside class="dials">
      <div class="group">
        <span class="label">mode</span>
        <div class="seg" id="modeSeg">
          <button type="button" data-v="shapes" aria-pressed="true">shapes</button>
          <button type="button" data-v="color" aria-pressed="false">color</button>
        </div>
        <span class="label">view</span>
        <div class="seg" id="viewSeg">
          <button type="button" data-v="photo" aria-pressed="false">photo</button>
          <button type="button" data-v="vector" aria-pressed="true">vector</button>
          <button type="button" data-v="overlay" aria-pressed="false">overlay</button>
        </div>
      </div>

      <div class="group" id="shapesGroup">
        <div class="ctl">
          <div class="ctl-head"><label for="thr">threshold</label>
            <span class="row"><span class="val" id="thrVal"></span><button type="button" class="mini" id="autoBtn" aria-pressed="true">auto</button></span></div>
          <input type="range" id="thr" min="1" max="254" value="128">
        </div>
        <label class="check"><input type="checkbox" id="invert"> invert (trace light areas)</label>
        <div class="ctl">
          <span class="label">fill</span>
          <div class="swatches" id="swatches">
            <button type="button" class="sw" data-c="#111111" style="background:#111111" aria-label="Black" aria-pressed="true"></button>
            <button type="button" class="sw" data-c="#FFFFFF" style="background:#FFFFFF" aria-label="White" aria-pressed="false"></button>
            <button type="button" class="sw" data-c="#C0C0C0" style="background:#C0C0C0" aria-label="Silver" aria-pressed="false"></button>
            <button type="button" class="sw" data-c="#D08A8A" style="background:#D08A8A" aria-label="Rose" aria-pressed="false"></button>
            <span class="sw-pick" title="Custom color"><input type="color" id="customColor" value="#7a3cff" aria-label="Custom fill color"><span>+</span></span>
          </div>
        </div>
      </div>

      <div class="group" id="colorGroup" hidden>
        <div class="ctl">
          <div class="ctl-head"><label for="ncol">colors</label><span class="val" id="ncolVal"></span></div>
          <input type="range" id="ncol" min="2" max="10" value="5">
        </div>
        <label class="check"><input type="checkbox" id="keepBg" checked> keep background layer</label>
      </div>

      <div class="group">
        <div class="ctl">
          <div class="ctl-head"><label for="detail">detail</label><span class="val" id="detailVal"></span></div>
          <input type="range" id="detail" min="1" max="10" value="7">
        </div>
        <div class="ctl">
          <div class="ctl-head"><label for="smooth">smoothing</label><span class="val" id="smoothVal"></span></div>
          <input type="range" id="smooth" min="0" max="6" value="2">
        </div>
        <div class="ctl">
          <div class="ctl-head"><label for="speck">remove specks</label><span class="val" id="speckVal"></span></div>
          <input type="range" id="speck" min="0" max="300" step="5" value="20">
        </div>
        <label class="check"><input type="checkbox" id="curves" checked> curved paths</label>
        <label class="check"><input type="checkbox" id="anchors"> show anchor points</label>
        <div class="ctl">
          <span class="label">capture resolution</span>
          <div class="seg" id="resSeg">
            <button type="button" data-v="480" aria-pressed="false">fast</button>
            <button type="button" data-v="900" aria-pressed="true">balanced</button>
            <button type="button" data-v="1600" aria-pressed="false">fine</button>
          </div>
        </div>
      </div>

      <div class="group">
        <button type="button" class="btn primary" id="dlBtn">download svg</button>
        <div class="two">
          <button type="button" class="btn" id="copyBtn">copy svg</button>
          <button type="button" class="btn" id="codeBtn" aria-expanded="false">show code</button>
        </div>
        <textarea id="code" readonly hidden aria-label="SVG code"></textarea>
      </div>
    </aside>
  </div>
</div>
<video id="vid" playsinline muted autoplay hidden></video>
<div class="toast" id="toast" role="status"></div>

<script type="module" src="/js/pages/vectorcam.js"></script>
</body>
</html>
