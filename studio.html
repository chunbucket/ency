<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ency · studio</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32">
<link rel="icon" href="/favicon-16.png" type="image/png" sizes="16x16">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>
  :root {
    --paper: #232323;
    --ink:   #c0c0c0;
    --dim:   #6f6f6f;
    --faint: #3a3a3a;
    --mono:  ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; background: var(--paper); }
  body { color: var(--ink); font: 11px/1.6 var(--mono); letter-spacing: 0.02em; -webkit-font-smoothing: antialiased; }

  #cv { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

  /* ---- panel: same glass as the lock modal, docked ---- */
  #panel {
    position: fixed;
    top: 14px; right: 14px; bottom: 14px;
    z-index: 5;
    width: 268px;
    display: flex; flex-direction: column;
    border-radius: 18px;
    background: rgba(38, 38, 38, 0.55);
    border: 1px solid rgba(255, 255, 255, 0.11);
    backdrop-filter: blur(30px) saturate(1.5);
    -webkit-backdrop-filter: blur(30px) saturate(1.5);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.13), 0 22px 50px rgba(0,0,0,0.45);
    overflow: hidden;
    user-select: none;
  }
  #panel.min { bottom: auto; }
  #panel.min #body, #panel.min #foot { display: none; }

  #head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 14px;
    font-size: 10px; letter-spacing: 0.24em; color: var(--ink);
    cursor: pointer; flex: none;
  }
  #head button { background: none; border: 0; color: var(--dim); font: inherit; font-size: 13px; cursor: pointer; }

  #body { flex: 1; overflow-y: auto; padding: 0 14px 8px; scrollbar-width: thin; }
  #body::-webkit-scrollbar { width: 6px; }
  #body::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.12); border-radius: 3px; }

  .sec { margin: 12px 0 7px; font-size: 9px; letter-spacing: 0.26em; color: var(--faint); }
  .dial { margin-bottom: 9px; }
  .dtop { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 3px; }
  .dtop .n { color: var(--dim); font-size: 10px; letter-spacing: 0.1em; }
  .dtop .v { color: var(--ink); font-size: 10px; font-variant-numeric: tabular-nums; }

  input[type=range] {
    -webkit-appearance: none; appearance: none;
    width: 100%; height: 2px; border-radius: 2px;
    background: rgba(255,255,255,0.16); outline: 0; cursor: pointer;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 11px; height: 11px; border-radius: 50%;
    background: var(--ink); cursor: pointer;
  }
  input[type=range]::-moz-range-thumb { width: 11px; height: 11px; border: 0; border-radius: 50%; background: var(--ink); }

  .seg { display: flex; gap: 3px; flex-wrap: wrap; }
  .seg button {
    flex: 1 1 auto;
    padding: 5px 7px;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.07);
    border-radius: 6px;
    color: var(--dim);
    font: 10px/1 var(--mono); letter-spacing: 0.06em;
    cursor: pointer; transition: all 120ms ease;
  }
  .seg button:hover { color: var(--ink); }
  .seg button[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: #1b1b1b; }

  input[type=color] {
    -webkit-appearance: none; appearance: none;
    width: 100%; height: 22px; padding: 0;
    background: none; border: 1px solid rgba(255,255,255,0.14);
    border-radius: 6px; cursor: pointer;
  }
  input[type=color]::-webkit-color-swatch-wrapper { padding: 2px; }
  input[type=color]::-webkit-color-swatch { border: 0; border-radius: 4px; }

  #foot { flex: none; padding: 11px 14px 13px; border-top: 1px solid rgba(255,255,255,0.08); display: flex; flex-direction: column; gap: 7px; }
  .btn {
    padding: 8px 10px;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 8px; color: var(--ink);
    font: 10px/1 var(--mono); letter-spacing: 0.14em;
    cursor: pointer; transition: background 120ms ease;
  }
  .btn:hover { background: rgba(255,255,255,0.14); }
  .btn.primary { background: var(--ink); border-color: var(--ink); color: #1b1b1b; }
  .btn.primary:hover { background: #fff; }
  .btn.thin { padding: 6px 10px; letter-spacing: 0.1em; color: var(--dim); }
  .rowb { display: flex; gap: 6px; }
  .rowb .btn { flex: 1; }
  #status { font-size: 9px; letter-spacing: 0.1em; color: var(--dim); min-height: 12px; text-align: center; }

  /* history + subscribers + numbers */
  #hist, #subs, #nums { margin-top: 4px; }
  .hd { display: flex; justify-content: space-between; font-size: 10px; color: var(--dim); letter-spacing: 0.1em; }
  #hlist { margin-top: 5px; max-height: 92px; overflow-y: auto; border-top: 1px solid rgba(255,255,255,0.06); padding-top: 4px; }
  #hlist button {
    display: block; width: 100%; text-align: left;
    padding: 4px 6px; margin-bottom: 2px;
    background: none; border: 1px solid transparent; border-radius: 5px;
    color: var(--dim); font: 10px/1.4 var(--mono);
    font-variant-numeric: tabular-nums; cursor: pointer;
  }
  #hlist button:hover { color: var(--ink); border-color: rgba(255,255,255,0.14); }
  #hlist .none { font-size: 10px; color: var(--faint); padding: 2px 6px; }
  #list, #plist {
    margin-top: 6px; max-height: 116px; overflow-y: auto;
    font-size: 10px; color: var(--dim); line-height: 1.75;
    border-top: 1px solid rgba(255,255,255,0.06); padding-top: 5px;
    user-select: text; word-break: break-all;
  }
  #list div, #plist div { font-variant-numeric: tabular-nums; }

  :focus-visible { outline: 1px solid rgba(255,255,255,0.5); outline-offset: 2px; }
</style>
</head>
<body>

<canvas id="cv"></canvas>

<div id="panel">
  <div id="head"><span>◈ STUDIO</span><button id="min" aria-label="Collapse">—</button></div>
  <div id="body"></div>
  <div id="foot">
    <button class="btn primary" id="publish">PUBLISH TO PUBLIC</button>
    <div class="rowb">
      <button class="btn thin" id="replay">replay</button>
      <button class="btn thin" id="revert">revert</button>
    </div>
    <div id="status"></div>
    <div id="hist">
      <div class="hd"><span>previously published</span><span id="hcount">—</span></div>
      <div id="hlist"></div>
    </div>
    <div id="subs">
      <div class="hd"><span>subscribers</span><span id="count">—</span></div>
      <div id="list"></div>
    </div>
    <div id="nums">
      <div class="hd"><span>numbers</span><span id="pcount">—</span></div>
      <div id="plist"></div>
    </div>
    <button class="btn thin" id="logout">log out</button>
  </div>
</div>

<script src="/js/vendor/ribbon.js"></script>
<script>
(async () => {
  'use strict';

  // Every dial the renderer understands. Ranges match the source artifact's.
  const DIALS = [
    ['playback', [
      { k: 'loop',    t: 'seg',   opts: [['off', false], ['on', true]] },
      { k: 'tempo',   t: 'range', min: 0.5, max: 3.5, step: 0.05, fmt: v => v.toFixed(2) + '×' },
      { k: 'random',  t: 'seg',   opts: [['random', true], ['fixed', false]], label: 'variation' },
      { k: 'ambient', t: 'range', min: 0, max: 10, step: 0.5, fmt: v => v.toFixed(1) + 's' },
    ]],
    ['form', [
      { k: 'scale',   t: 'range', min: 0.4, max: 2, step: 0.05, label: 'size', fmt: v => v.toFixed(2) + '×' },
      { k: 'thin',    t: 'range', min: 0, max: 0.06, step: 0.002, label: 'thin', fmt: v => (v * 100).toFixed(1) + '%' },
      { k: 'rotate',  t: 'range', min: -45, max: 45, step: 0.01, label: 'rotate', fmt: v => v.toFixed(2) + '°' },
      { k: 'gran',    t: 'range', min: 50, max: 520, step: 5, label: 'detail', fmt: v => String(Math.round(v)) },
      { k: 'charset', t: 'seg',   opts: [['ascii', 'ascii'], ['blocks', 'blocks'], ['binary', 'binary']] },
      { k: 'twist',   t: 'seg',   opts: [['möbius', 1], ['double', 2], ['triple', 3]] },
      { k: 'trail',   t: 'range', min: 0, max: 1, step: 0.05 },
      { k: 'gather',  t: 'range', min: 0, max: 1, step: 0.05 },
      { k: 'chaos',   t: 'range', min: 0, max: 2, step: 0.05, label: 'swarm' },
      { k: 'reveal',  t: 'seg',   opts: [['auto', 'auto'], ['sweep', 'sweep'], ['write', 'write']] },
    ]],
    ['idle', [
      { k: 'float',   t: 'range', min: 0, max: 4.5, step: 0.1, fmt: v => v.toFixed(1) },
      { k: 'bend',    t: 'range', min: 0, max: 2.5, step: 0.1, fmt: v => v.toFixed(1) },
      { k: 'mouse',   t: 'range', min: 0, max: 1.5, step: 0.05 },
      { k: 'freedom', t: 'range', min: 0, max: 1, step: 0.05 },
    ]],
    ['color', [
      // diffraction picked up from the fixed lamp — only while the sheet is
      // turning through the angle, never on the formed mark
      // how far the ambient field steps back once the mark lands. At 1 the
      // backdrop is 2x brighter mid-tumble than formed, which reads as the
      // screen breathing; 0 holds it steady.
      { k: 'recede',   t: 'range', min: 0, max: 1, step: 0.01, label: 'backdrop recede' },
      { k: 'holo',     t: 'range', min: 0, max: 1, step: 0.01, label: 'glimmer' },
      // angular tolerance of the catch: tight = a rare precise glint, wide = the
      // sheet picks the lamp up over a broader sweep
      { k: 'holoWide', t: 'range', min: 0, max: 1, step: 0.01, label: 'catch width' },
      { k: 'paper', t: 'color' },
      { k: 'ink',   t: 'color' },
    ]],
  ];

  let published = null;
  try {
    const r = await fetch('/api/preset');
    if (r.ok) published = (await r.json()).preset;
  } catch { /* defaults */ }

  const ribbon = window.__ribbon = createRibbon({
    canvas: document.getElementById('cv'),
    container: document.body,
    state: published || {},
  });

  // ---- build the panel from DIALS
  const body = document.getElementById('body');
  const syncers = [];

  for (const [section, items] of DIALS) {
    const h = document.createElement('div');
    h.className = 'sec';
    h.textContent = section;
    body.appendChild(h);

    for (const d of items) {
      const wrap = document.createElement('div');
      wrap.className = 'dial';
      const state = ribbon.getState();

      if (d.t === 'range') {
        const fmt = d.fmt || (v => v.toFixed(2));
        wrap.innerHTML =
          `<div class="dtop"><span class="n">${d.label || d.k}</span><span class="v"></span></div>`;
        const val = wrap.querySelector('.v');
        const input = document.createElement('input');
        input.type = 'range';
        input.min = d.min; input.max = d.max; input.step = d.step;
        input.value = state[d.k];
        input.setAttribute('aria-label', d.label || d.k);
        val.textContent = fmt(Number(input.value));
        input.addEventListener('input', () => {
          const v = parseFloat(input.value);
          val.textContent = fmt(v);
          ribbon.setState({ [d.k]: v });
        });
        wrap.appendChild(input);
        syncers.push(s => { input.value = s[d.k]; val.textContent = fmt(Number(s[d.k])); });

      } else if (d.t === 'seg') {
        wrap.innerHTML = `<div class="dtop"><span class="n">${d.label || d.k}</span></div>`;
        const seg = document.createElement('div');
        seg.className = 'seg';
        const buttons = d.opts.map(([text, value]) => {
          const b = document.createElement('button');
          b.type = 'button';
          b.textContent = text;
          b.setAttribute('aria-pressed', String(state[d.k] === value));
          b.addEventListener('click', () => {
            buttons.forEach(o => o.setAttribute('aria-pressed', 'false'));
            b.setAttribute('aria-pressed', 'true');
            ribbon.setState({ [d.k]: value });
          });
          seg.appendChild(b);
          return b;
        });
        wrap.appendChild(seg);
        syncers.push(s => buttons.forEach((b, i) =>
          b.setAttribute('aria-pressed', String(d.opts[i][1] === s[d.k]))));

      } else if (d.t === 'color') {
        wrap.innerHTML = `<div class="dtop"><span class="n">${d.label || d.k}</span><span class="v"></span></div>`;
        const val = wrap.querySelector('.v');
        const input = document.createElement('input');
        input.type = 'color';
        input.value = state[d.k];
        input.setAttribute('aria-label', d.k);
        val.textContent = state[d.k];
        input.addEventListener('input', () => {
          val.textContent = input.value;
          ribbon.setState({ [d.k]: input.value });
        });
        wrap.appendChild(input);
        syncers.push(s => { input.value = s[d.k]; val.textContent = s[d.k]; });
      }

      body.appendChild(wrap);
    }
  }

  const syncPanel = () => { const s = ribbon.getState(); syncers.forEach(fn => fn(s)); };

  // ---- actions
  const status = document.getElementById('status');
  let clear;
  const say = msg => {
    status.textContent = msg;
    clearTimeout(clear);
    clear = setTimeout(() => { status.textContent = ''; }, 2600);
  };

  document.getElementById('publish').addEventListener('click', async () => {
    const preset = ribbon.getState();
    try {
      const r = await fetch('/api/preset', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ preset }),
      });
      if (r.ok) { published = preset; say('published'); loadHistory(); }
      else if (r.status === 401) { location.href = '/'; }
      else say('publish failed');
    } catch { say('no connection'); }
  });

  document.getElementById('revert').addEventListener('click', () => {
    if (!published) { say('nothing published yet'); return; }
    ribbon.setState(published);
    syncPanel();
    say('reverted to published');
  });

  document.getElementById('replay').addEventListener('click', () => ribbon.play());

  document.getElementById('min').addEventListener('click', e => {
    e.stopPropagation();
    document.getElementById('panel').classList.toggle('min');
  });
  document.getElementById('head').addEventListener('click', () =>
    document.getElementById('panel').classList.toggle('min'));

  document.getElementById('logout').addEventListener('click', async () => {
    await fetch('/api/logout', { method: 'POST' }).catch(() => {});
    location.href = '/';
  });

  // ---- previously published: every preset a publish replaced, newest first.
  // Clicking one loads it into the renderer but does not publish it — you still
  // have to hit publish, so browsing history can't itself change the public page.
  async function loadHistory() {
    try {
      const r = await fetch('/api/preset/history');
      if (!r.ok) return;
      const { history } = await r.json();
      document.getElementById('hcount').textContent = history.length || '—';
      const list = document.getElementById('hlist');
      list.innerHTML = '';
      if (!history.length) {
        const n = document.createElement('div');
        n.className = 'none';
        n.textContent = 'nothing replaced yet';
        list.appendChild(n);
        return;
      }
      for (const h of history) {
        const b = document.createElement('button');
        b.type = 'button';
        const t = h.ts.slice(5, 16).replace('T', ' ');
        b.textContent = `${t}  ${h.preset.charset || '?'} ${(h.preset.scale ?? 1)}× ${h.preset.ink || ''}`;
        b.title = 'load into the studio (does not publish)';
        b.addEventListener('click', () => {
          ribbon.setState(h.preset);
          syncPanel();
          say('loaded — publish to make it live');
        });
        list.appendChild(b);
      }
    } catch { /* non-fatal */ }
  }
  loadHistory();

  // ---- subscribers
  try {
    const r = await fetch('/api/subscribers');
    if (r.ok) {
      const { count, subscribers } = await r.json();
      document.getElementById('count').textContent = count;
      const list = document.getElementById('list');
      if (!count) list.textContent = 'none yet';
      else for (const s of subscribers.slice().reverse()) {
        const row = document.createElement('div');
        row.textContent = `${s.ts.slice(0, 10)}  ${s.email}`;
        list.appendChild(row);
      }
    }
  } catch { /* non-fatal */ }

  // ---- numbers (the lobby's list — this panel is the only place they show)
  try {
    const r = await fetch('/api/phones');
    if (r.ok) {
      const { count, phones } = await r.json();
      document.getElementById('pcount').textContent = count;
      const list = document.getElementById('plist');
      if (!count) list.textContent = 'none yet';
      else for (const s of phones.slice().reverse()) {
        const row = document.createElement('div');
        row.textContent = `${s.ts.slice(0, 10)}  ${s.phone}`;
        list.appendChild(row);
      }
    }
  } catch { /* non-fatal */ }
})();
</script>
</body>
</html>
